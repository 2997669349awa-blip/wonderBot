apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wonderbot-data-pvc
  namespace: wonderbot-standalone-ns
  labels:
    app: wonderbot-standalone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard # uncomment and set proper StorageClass