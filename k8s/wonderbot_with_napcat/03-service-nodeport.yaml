apiVersion: v1
kind: Service
metadata:
  name: wonderbot-service-nodeport
  namespace: wonderbot-ns
  labels:
    app: wonderbot-stack
spec:
  type: NodePort
  selector:
    app: wonderbot-stack
  ports:
    - name: napcat-web
      port: 6099
      targetPort: 6099
      # nodePort: 30099 # Optional: Specify a fixed NodePort if needed, otherwise remove this line
    - name: wonderbot-web
      port: 6185
      targetPort: 6185
      # nodePort: 30185 # Optional: Specify a fixed NodePort if needed, otherwise remove this line