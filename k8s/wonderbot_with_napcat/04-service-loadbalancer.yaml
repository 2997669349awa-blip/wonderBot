apiVersion: v1
kind: Service
metadata:
  name: wonderbot-service-lb
  namespace: wonderbot-ns
  labels:
    app: wonderbot-stack
spec:
  type: LoadBalancer
  selector:
    app: wonderbot-stack
  ports:
    - name: napcat-web
      port: 6099
      targetPort: 6099
    - name: wonderbot-web
      port: 6185
      targetPort: 6185